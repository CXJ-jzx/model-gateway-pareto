[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bp-slo-lab"
version = "0.1.0"
description = "Independent, auditable BP request dataset and SLO analysis"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
include = ["bp_slo*"]

